[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edizora"
version = "0.1"
description = "Edizora — desktop app for artwork, news and Telegram publishing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4",
  "aiohttp>=3.14.5,<4",
  "certifi>=2026.10.23",
  "multidict>=6.9.1,<8",
  "urllib3>=2.8,<3",
  "SQLAlchemy>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "pydantic-settings>=2.5,<3",
  "Pillow>=13,<14",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "argon2-cffi>=23.1,<26",
  "cryptography>=50.0.2,<51",
  "paramiko>=5.1,<6",
  "python-multipart>=0.0.20,<1",
  "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
desktop = ["pystray>=0.19.5,<1"]
desktop-build = ["pyinstaller>=6.16,<7"]
postgres = ["asyncpg>=0.29,<1"]
proxy = ["aiohttp-socks>=0.9,<1"]
news-worker = [
  "trafilatura>=2.0,<3",
  "extruct>=0.18,<1",
  "yt-dlp[default]>=2025.11.12",
  "youtube-transcript-api>=1.2,<2",
  "rapidocr>=3.10,<4",
  "onnxruntime>=1.23,<2",
  "imageio-ffmpeg>=0.6,<1",
  "faster-whisper>=1.2,<2",
  "av>=14,<19",
]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6,<8",
]

[project.scripts]
edizora = "app.desktop.launcher:run"
news-home-worker = "app.home_worker:run"
edizora-local = "app.local:run"
edizora-web = "app.web:run"
edizora-ai-worker = "app.worker_v1:run"
edizora-desktop = "app.desktop.launcher:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
