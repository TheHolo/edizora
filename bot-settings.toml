[bot]
storage_path = "./storage"
log_level = "INFO"
worker_count = 1
max_job_attempts = 3
download_timeout = 60
max_download_size_mb = 47
max_tags = 20
max_tag_length = 64
max_urls_per_message = 10

auto_add_source_tags = true
auto_translate_titles = true
translation_timeout = 5
translation_lmstudio_timeout = 60
translation_fallback_mymemory = true

pixiv_media_limit_enabled = true
pixiv_max_images = 10

delete_files_after_publish = true
files_ttl_hours = 24
timezone = "Asia/Vladivostok"
news_api_host = "127.0.0.1"
news_api_port = 8091
news_task_lease_seconds = 1800
news_model_name = "gemma4:12b"

# Local mode reads the model ID from .env and synchronizes bot + worker automatically.
# Optional tuning; set LM Studio's loaded model context to at least this size.
# [home_worker]
# lmstudio_context_length = 8192
# lmstudio_max_predict_tokens = 1600
# lmstudio_timeout_seconds = 600
# temperature = 0.1

# Alternative: standalone worker with Ollama. Keep its token in .env.
# [home_worker]
# vps_api_url = "http://127.0.0.1:8091"
# ollama_base_url = "http://127.0.0.1:11434"
# ollama_model = "gemma4:12b"
# poll_interval_seconds = 5
# lease_seconds = 1800
# ollama_context_length = 8192
# temperature = 0.1
